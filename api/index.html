<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Contatos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4 text-center">Agenda de Contatos</h2>
        
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover border align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>NOME</th>
                                <th>FONE</th>
                                <th>EMAIL</th>
                                <th class="text-center" style="width: 150px;">AÇÕES</th>
                            </tr>
                        </thead>
                        <tbody id="corpo-tabela">
                            <tr>
                                <td colspan="5" class="text-center text-muted">Carregando dados...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="text-center">
            <a href="formulario.html" class="btn btn-success btn-lg px-5">+ Novo Cadastro</a>
        </div>
    </div>

    <script>
        async function buscarContatos() {
            try {
                const resposta = await fetch('http://localhost:8000');
                const dados = await resposta.json();
                const tbody = document.getElementById('corpo-tabela');

                if (dados.length > 0) {
                    let htmlCorpo = '';
                    dados.forEach(linha => {
                        htmlCorpo += `<tr>
                            <td>${linha.id || ''}</td>
                            <td>${linha.nome || ''}</td>
                            <td>${linha.fone || ''}</td>
                            <td>${linha.email || ''}</td>
                            <td class="text-center">
                                <a href="formulario.html?id=${linha.id}" class="btn btn-sm btn-primary me-1">Editar</a>
                                <button onclick="excluirContato(${linha.id})" class="btn btn-sm btn-danger">Excluir</button>
                            </td>
                        </tr>`;
                    });
                    tbody.innerHTML = htmlCorpo;
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Nenhum contato cadastrado.</td></tr>';
                }
            } catch (erro) {
                document.getElementById('corpo-tabela').innerHTML = '<tr><td colspan="5" class="text-center text-danger fw-bold">Erro de conexão com a API.</td></tr>';
            }
        }

        function excluirContato(id) {
            Swal.fire({
                title: 'Tem certeza?',
                text: "Você não poderá reverter esta exclusão!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sim, excluir!',
                cancelButtonText: 'Cancelar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await fetch('http://localhost:8000', {
                        method: 'POST',
                        body: `excluir|${id}|`
                    });
                    Swal.fire('Excluído!', 'O contato foi removido.', 'success');
                    buscarContatos();
                }
            });
        }

        buscarContatos();
    </script>
</body>
</html>
